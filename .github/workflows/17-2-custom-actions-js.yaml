name: 17 - 2 - Custom Actions - JS
run-name: 17 - 2 - Custom Actions - JS | BB - ${{ inputs.base-branch }} TB - ${{ inputs.target-branch }} WD - ${{ inputs.working-directory }}
on:
  workflow_dispatch:
    inputs:
      base-branch:
        type: string
        default: main

      target-branch:
        type: string
        default: update-dependencies
    
      working-directory:
        type: string
        default: 17-custom-actions/react-app
    
      gh-token:
        description: Authentication token with repository access. Must have write access to contents and pull-requests
        required: true
        default: ${{ secrets.GITHUB_TOKEN }}
    
      debug:
        description: Whether the output debug messages to the console
        required: false

jobs:
  dependency-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for dependency updates
        uses: ./.github/actions/js-dependency-update
        with:
          base-branch: ${{ inputs.base-branch }}
          target-branch: ${{ inputs.target-branch }}
          working-directory: ${{ inputs.working-directory }}

