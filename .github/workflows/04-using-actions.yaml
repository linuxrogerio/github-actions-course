name: 04 - Using Actions
on: push
jobs:
  build:
    defaults:
      run:
        working-directory: 04-using-actions/react-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Printing Folders
        run: ls

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test

